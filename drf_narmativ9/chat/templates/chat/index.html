<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Django Real-time Chat</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #121212; color: #fff; }
        #chat-log { width: 100%; height: 300px; border: 1px solid #333; background: #1e1e1e; padding: 10px; overflow-y: scroll; margin-bottom: 10px; }
        input { padding: 10px; width: 70%; border-radius: 4px; border: none; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>🚀 Real-time WebSocket Chat</h2>
    <div id="chat-log"></div>
    <input id="chat-message-input" type="text" placeholder="Xabaringizni yozing...">
    <button id="chat-message-submit">Yuborish</button>

    <script>
        // WebSocket ulanishi
        const chatSocket = new WebSocket('ws://' + window.location.host + '/ws/chat/');

        chatSocket.onmessage = function(e) {
            const data = JSON.parse(e.data);
            const chatLog = document.querySelector('#chat-log');
            chatLog.innerHTML += `<div><b>${data.username}:</b> ${data.message}</div>`;
            chatLog.scrollTop = chatLog.scrollHeight;
        };

        chatSocket.onclose = function(e) {
            console.error('Chat socket kutilmaganda yopildi');
        };

        document.querySelector('#chat-message-submit').onclick = function(e) {
            const messageInputDom = document.querySelector('#chat-message-input');
            const message = messageInputDom.value;
            if(message.trim() !== '') {
                chatSocket.send(jsonFormat = JSON.stringify({
                    'message': message,
                    'username': 'User_' + Math.floor(Math.random() * 1000)
                }));
                messageInputDom.value = '';
            }
        };

        document.querySelector('#chat-message-input').onkeyup = function(e) {
            if (e.keyCode === 13) {  // Enter bosilganda
                document.querySelector('#chat-message-submit').click();
            }
        };
    </script>
</body>
</html>
