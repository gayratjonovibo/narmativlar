<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }} - Batafsil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">

                    {# Agar postda rasm bo'lsa, uni ko'rsatish (Normativ 9-bosqich) #}
                    {% if post.image %}
                        <img src="{{ post.image.url }}" class="card-img-top" alt="{{ post.title }}">
                    {% endif %}

                    <div class="card-body">
                        <h1 class="card-title">{{ post.title }}</h1>
                        <hr>
                        <p class="card-text" style="font-size: 1.2rem; line-height: 1.6;">
                            {{ post.content }}
                        </p>
                    </div>

                    <div class="card-footer d-flex justify-content-between">
                        <a href="{% url 'post_list' %}" class="btn btn-secondary">⬅ Orqaga qaytish</a>

                        {# 7 va 8-normativ ruxsatnomalari bo'lsa (ixtiyoriy qo'shimcha) #}
                        <div>
                            {% if perms.posts.change_post %}
                                <a href="#" class="btn btn-warning">Tahrirlash</a>
                            {% endif %}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
